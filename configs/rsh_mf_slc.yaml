name: rsh

model_type: segmented_regression

segmentation_col: general_type

fit_filters:
- county_id==35
- building_type_id == 2
- res_price_per_sqft > 20.0
- res_price_per_sqft < 400.0
- 5000 > sqft_per_unit > 400
- 2020 > year_built > 1900
- residential_units < 200
- building_sqft > 800
- parcel_acres < 10
- 100000 < improvement_value < 10000000

predict_filters:
- county_id==35
- sqft_per_unit > 0
- sqft_per_unit <= 5000
- building_type_id == 2

min_segment_size: 10

default_config:
    model_expression: sqft_per_unit + commute_time + land_value_per_acre + volume_two_way

    ytransform: np.exp

models:
